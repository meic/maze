{% extends "bookmaze/base.html" %}

{% load crispy_forms_tags %}

{% block formmedia %}
  {{ form.media }}
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="custom-card">
            <h2 class="mb-4 text-center">{% block title %}{{ title }}{% endblock %}</h2>
            {% crispy form %}
        </div>
    </div>
</div>
{% endblock %}
